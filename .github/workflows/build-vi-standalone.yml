      - name: Lấy bộ Runtime Linux arm64 từ bản phát hành chính thức
        run: |
          mkdir -p runtime/out/arm64-v8a/assets runtime/out/arm64-v8a/jniLibs/arm64-v8a
          REL_URL=$(curl -sL https://api.github.com/repos/ccch1mneyyy/dsh-Go/releases/latest             | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d.get('assets',[]) if a['name'].endswith('-arm64.apk')))")
          echo "Downloading official APK from $REL_URL"
          curl -sL "$REL_URL" -o /tmp/official-arm64.apk
          python3 - << 'PYEXTRACT'
          import zipfile, os, shutil
          z = zipfile.ZipFile('/tmp/official-arm64.apk')
          for n in z.namelist():
              if n.startswith('assets/runtime/'):
                  dest = os.path.join('runtime/out/arm64-v8a', n)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with z.open(n) as src, open(dest, 'wb') as dst:
                      shutil.copyfileobj(src, dst)
              elif n in ('lib/arm64-v8a/libproot.so','lib/arm64-v8a/libproot-loader.so','lib/arm64-v8a/libtalloc.so','lib/arm64-v8a/libandroid-shmem.so'):
                  dest = os.path.join('runtime/out/arm64-v8a/jniLibs/arm64-v8a', os.path.basename(n))
                  with z.open(n) as src, open(dest, 'wb') as dst:
                      shutil.copyfileobj(src, dst)
          PYEXTRACT
          rm -f /tmp/official-arm64.apk
          ls -lh runtime/out/arm64-v8a/assets/runtime/ runtime/out/arm64-v8a/jniLibs/arm64-v8a/

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Sinh mã nguồn ngôn ngữ Tiếng Việt (gen-l10n)
        working-directory: app
        run: |
          flutter pub get
          python3 tool/l10n_merge.py --locale vi
          python3 tool/l10n_merge.py --check --locale vi

      - name: Build APK Tiếng Việt (Bản chuẩn + Bản cài song song)
        run: |
          mkdir -p /tmp/apk-out
          chmod +x tooling/build-apk.sh
          ./tooling/build-apk.sh --release --flavor arm64
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk /tmp/apk-out/dsh-go-vi-arm64.apk

          # Build thêm bản cài song song (id: io.github.ccch1mneyyy.dsh_app.vi) để không cần gỡ app cũ
          sed -i 's/applicationId = "io.github.ccch1mneyyy.dsh_app"/applicationId = "io.github.ccch1mneyyy.dsh_app.vi"/g' app/android/app/build.gradle.kts
          ./tooling/build-apk.sh --release --flavor arm64
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk /tmp/apk-out/dsh-go-vi-song-song-arm64.apk
          ls -lh /tmp/apk-out/

      - name: Tải 2 file APK Tiếng Việt lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-TiengViet-APK
          path: /tmp/apk-out/*.apk
          if-no-files-found: error